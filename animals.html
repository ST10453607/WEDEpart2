    <title>Adoptable Dogs &amp; Cats | Paws &amp; Home Animal Shelter</title>
    <meta name="description" content="Browse dogs and cats waiting for a forever home at Paws &amp; Home. Search by name, filter by type and send an adoption enquiry online.">
    <meta name="keywords" content="adopt a dog Cape Town, adopt a cat Cape Town, adoptable pets, rescue dogs, rescue cats, pet adoption">

<header>
    <nav>
        <a href="index.html" class="logo">Paws & Home</a>
        <ul>
            <li><a href="index.html">Home</a></li>

<main>
    <section class="page-intro">
        <h1>Adoptable Animals</h1>
        <p>Browse our current animals looking for their forever home. Filters for type and age are coming in a future update.</p>
    </section>

    <section class="filters">
        <label for="search" class="visually-hidden">Search animals</label>
        <input type="search" id="search" placeholder="Search by name or trait...">
        <select id="sort" aria-label="Sort animals">
            <option value="name">Sort: Name (A-Z)</option>
            <option value="age">Sort: Age (youngest first)</option>
        </select>
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="dog">Dogs</button>
        <button class="filter-btn" data-filter="cat">Cats</button>
    </section>

    <p id="results-count" aria-live="polite"></p>
    <section class="animal-gallery" id="animal-gallery"></section>

    <div id="lightbox" class="lightbox" hidden>
        <button id="lightbox-close" aria-label="Close image">&times;</button>
        <img id="lightbox-img" src="" alt="">
        <p id="lightbox-caption"></p>
    </div>
    </section>
</main>
